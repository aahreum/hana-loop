<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4bb074"/>
      <stop offset="100%" stop-color="#308af9"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- H: left bar -->
  <rect x="8" y="7" width="4" height="18" rx="1" fill="white"/>
  <!-- H: right bar -->
  <rect x="20" y="7" width="4" height="18" rx="1" fill="white"/>
  <!-- H: crossbar -->
  <rect x="8" y="14.5" width="16" height="3" rx="0.5" fill="white"/>
</svg>
